name: Build [All]

on:
  push:
    paths:
      - 'installer/**'
      - 'installer_res/**'
      - '.github/workflows/compile-core.yml'

jobs:
  build-packages:
    # action 直接跑在运行器上；编译和打包放进原作者的 ps2dev:v1.0 镜像里执行
    # （老镜像的 Alpine 跑不了 GitHub 强制的 node24，不能再用 container:）
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get short SHA
      id: slug
      run: echo "SHA8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

    # 从 OPL 仓库 patch-1 分支的 latest 预发布拉取最新 FGOPL.ELF，作为 BOOT.ELF 和硬盘版 OPNPS2LD.ELF
    - name: Download latest FGOPL
      run: |
        set -e
        curl -fL --retry 3 -o FGOPL.ELF https://github.com/362053534/Open-PS2-Loader/releases/download/latest/FGOPL.ELF
        # 校验确实是 ELF 文件，避免把错误页面打进包里
        [ "$(head -c 4 FGOPL.ELF | od -An -tx1 | tr -d ' ')" = "7f454c46" ]
        ls -l FGOPL.ELF
        sha256sum FGOPL.ELF
        mkdir -p installer_res/1965/INSTALL/BOOT installer_res/1965/INSTALL/APPS-HDD/OPL
        cp -f FGOPL.ELF installer_res/1965/INSTALL/BOOT/BOOT.ELF
        cp -f FGOPL.ELF installer_res/1965/INSTALL/APPS-HDD/OPL/OPNPS2LD.ELF
        rm -f FGOPL.ELF

    - name: Compile and pack
      run: |
        docker run --rm -e SHA8="${SHA8}" -v "$GITHUB_WORKSPACE:/src" -w /src ps2dev/ps2dev:v1.0 sh -c '
          set -e
          apk add build-base git zip p7zip
          cd installer
          make rebuild FMCB_INSTALLER_VERSION=$SHA8 EE_BIN_DIR=../installer_res/
          make rebuild FMCB_INSTALLER_VERSION=$SHA8 EE_BIN_DIR=../installer_res/ EXFAT=1
          cd ../installer_res
          ls
          chmod +x ./pack.sh
          ./pack.sh
        '

    - name: Upload artifact
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: FMCB-${{ env.SHA8 }}
        path: |
            FMCB*.7z

    - name: Create release
      if: github.ref == 'refs/heads/master'
      uses: marvinpinto/action-automatic-releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "latest"
        title: "FreeMcBoot"
        files: |
            FMCB*.7z
